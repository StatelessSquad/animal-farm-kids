name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # gitleaks via its official image: free for organizations (gitleaks-action needs a paid license for orgs)
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --no-banner --exit-code 1
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make lint
      - run: make test
      - run: make build
      - name: Start preview server
        id: preview
        run: |
          npx vite preview --port 4173 &
          PREVIEW_PID=$!
          echo "PREVIEW_PID=$PREVIEW_PID" >> $GITHUB_ENV
          # wait for server to be ready
          sleep 5
      - name: Set BASE_URL
        run: echo "BASE_URL=http://localhost:4173/animal-farm-kids/" >> $GITHUB_ENV
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: npx playwright test
      - name: Stop preview server
        if: always()
        run: kill $PREVIEW_PID
